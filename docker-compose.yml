services:
  sideline:
    build: .
    image: sideline:local
    container_name: sideline
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: ${TZ:-UTC}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Owner of files under /data. Unraid usually uses 99/100; match your host user otherwise.
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
    volumes:
      - sideline-data:/data

volumes:
  sideline-data:
