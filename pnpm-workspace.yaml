packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
# next 16.3.8 (and its platform binaries) was newer than the release-age policy when T0.2
# installed it on 2026-10-01, so it is excluded here.
# TODO(T6.2): remove this exclusion once next 16.3.8 has aged past the policy.
minimumReleaseAgeExclude:
  - "@next/env@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - next@16.3.8
